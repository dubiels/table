app = "table-app"
primary_region = "sjc"

[build]

[env]
  DATABASE_PATH = "/data/table.sqlite"
  PORT = "3000"
  TZ = "America/New_York"

[[mounts]]
  source = "table_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
